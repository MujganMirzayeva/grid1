<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid</title>
    <style>
        body {
            margin: 0;
            background: white;
        }
        header,nav,article,aside,footer 
            { background: #f991d3;
              padding: 15px; }

        .container {
            display: grid;
            grid-template-columns: auto;
            grid-template-rows: 100px 30px 90px 20px 90px;
        }

        @media (min-width: 768px) {
            .container {
                max-width: 1000px;
                margin: auto;
                grid-template-columns: 20% 1fr 15%;
                grid-template-rows: 100px 450px 80px;
                gap: 10px;
            }
            header  { grid-area: 1 / 1 / span 1 / span 2; }
            aside   { grid-area: 1 / 3 / span 1 / span 1; }
            nav     { grid-area: 2 / 1 / span 2 / span 1; }
            article { grid-area: 2 / 2 / span 1 / span 2; }
            footer  { grid-area: 3 / 2 / span 1 / span 2; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>Header</header>
        <nav>Nav</nav>
        <article>Article</article>
        <aside>Ads</aside>
        <footer>Footer</footer>
    </div>
</body>
</html>
